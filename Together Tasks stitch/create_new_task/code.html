                        Me

                        Queen

</div>
</div>

<button class="py-2 px-3 rounded-lg bg-surface-container-highest text-tertiary text-xs font-bold uppercase tracking-tighter hover:bg-surface-bright transition-colors">Low</button>
<button class="py-2 px-3 rounded-lg bg-surface-container-highest text-on-surface text-xs font-bold uppercase tracking-tighter hover:bg-surface-bright transition-colors border border-primary/20">Medium</button>
<button class="py-2 px-3 rounded-lg bg-primary/10 text-primary text-xs font-bold uppercase tracking-tighter">High</button>
<button class="py-2 px-3 rounded-lg bg-error-container text-error text-xs font-bold uppercase tracking-tighter">Urgent</button>
</div>
</div>

<div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-weight="fill">calendar_today</span>
</div>
<div>
<div class="text-on-surface font-bold">Pick a Date</div>

</div>
</div>
</div>
<div class="bg-surface-container-low rounded-xl p-6 flex flex-col justify-between">

</div>
<div>
