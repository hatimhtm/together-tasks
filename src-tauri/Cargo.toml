[package]
name = "together-tasks"
version = "3.0.1"
description = "Together Tasks — A couple's shared task manager"
authors = ["Hatim"]
edition = "2021"
rust-version = "1.77.2"
default-run = "together-tasks"

[lib]
name = "together_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "together-tasks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
